# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
# modifeid to inject commit ID into sw cache version

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node.js auf eine Version zwingen, die den Netzwerk-Bug nicht hat
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Inject commit SHA into service worker cache name
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          SW_FILE=$(find ./public -name "sw.js" | head -n 1)
          if [ -z "$SW_FILE" ]; then
            echo "::error::sw.js not found under ./public"
            exit 1
          fi
          echo "Found service worker at: $SW_FILE"
          sed -i "s/__COMMIT_SHA__/${SHA_SHORT}/g" "$SW_FILE"
          grep CACHE_NAME "$SW_FILE"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true # verhindert, dass der Workflow wegen des API-Fehlers abbricht
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARGONKEY }}
          channelId: live
          projectId: argonkey
